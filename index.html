<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trading Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes slideIn {
      from {opacity: 0; transform: translateY(-10px);}
      to {opacity: 1; transform: translateY(0);}
    }
    .slide-in { animation: slideIn 0.3s ease-out; }
    .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
  <div class="container mx-auto px-4 py-8 max-w-7xl">
    <!-- Header -->
    <header class="text-center mb-10">
      <h1 class="text-4xl font-bold text-gray-800 mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600">
        📊 Trading Journal
      </h1>
      <p class="text-gray-600">Track your cryptocurrency trades with ease</p>
    </header>

    <!-- Form -->
    <div class="glass rounded-2xl shadow-xl p-8 mb-8 border border-white/20">
      <h2 class="text-2xl font-semibold text-gray-800 mb-6 flex items-center">
        <span class="mr-2">➕</span> Add New Trade
      </h2>

      <form id="tradeForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Coin Pair -->
        <div class="group">
          <label for="coinPair" class="block text-sm font-medium mb-2">Coin Pair</label>
          <input type="text" id="coinPair" placeholder="BTC/USDT" class="w-full px-4 py-3 border-2 rounded-lg" required />
        </div>

        <!-- Entry -->
        <div class="group">
          <label for="entryPrice" class="block text-sm font-medium mb-2">Entry Price ($)</label>
          <input type="number" id="entryPrice" step="0.00000001" min="0" class="w-full px-4 py-3 border-2 rounded-lg" required />
        </div>

        <!-- Exit -->
        <div class="group">
          <label for="exitPrice" class="block text-sm font-medium mb-2">Exit Price ($)</label>
          <input type="number" id="exitPrice" step="0.00000001" min="0" class="w-full px-4 py-3 border-2 rounded-lg" required />
        </div>

        <!-- Margin -->
        <div class="group">
          <label for="margin" class="block text-sm font-medium mb-2">Margin ($)</label>
          <input type="number" id="margin" step="0.01" min="0" class="w-full px-4 py-3 border-2 rounded-lg" required />
        </div>

        <!-- Leverage -->
        <div class="group">
          <label for="leverage" class="block text-sm font-medium mb-2">Leverage (x)</label>
          <input type="number" id="leverage" step="1" min="1" class="w-full px-4 py-3 border-2 rounded-lg" required />
        </div>

        <!-- Position -->
        <div class="group">
          <label for="position" class="block text-sm font-medium mb-2">Position</label>
          <select id="position" class="w-full px-4 py-3 border-2 rounded-lg" required>
            <option value="" disabled selected>Select</option>
            <option value="Long">Long</option>
            <option value="Short">Short</option>
          </select>
        </div>

        <!-- Date -->
        <div class="group">
          <label for="tradeDate" class="block text-sm font-medium mb-2">Trade Date</label>
          <input type="date" id="tradeDate" class="w-full px-4 py-3 border-2 rounded-lg" required />
        </div>

        <!-- Submit -->
        <div class="md:col-span-2 lg:col-span-3">
          <button type="submit" class="px-8 py-3 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold rounded-lg shadow-lg">
            Add Trade
          </button>
        </div>
      </form>
    </div>

    <!-- Table -->
    <div class="glass rounded-2xl shadow-xl p-8 border border-white/20">
      <h2 class="text-2xl font-semibold text-gray-800 mb-6">📈 Trade History</h2>
      <div class="overflow-x-auto">
        <table class="w-full">
          <!-- Table Header -->
          <thead>
            <tr class="border-b-2 border-gray-200">
              <th class="px-4 py-3">Coin Pair</th>
              <th class="px-4 py-3">Entry</th>
              <th class="px-4 py-3">Exit</th>
              <th class="px-4 py-3">Margin</th>
              <th class="px-4 py-3">Leverage</th>
              <th class="px-4 py-3">Position</th>
              <th class="px-4 py-3">P/L (USDT)</th>
              <th class="px-4 py-3">Date</th>
              <th class="px-4 py-3">Actions</th>
            </tr>
          </thead>
          <tbody id="tradesTableBody"></tbody>
        </table>
        <div id="emptyState" class="text-center py-12 text-gray-500">No trades recorded yet</div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      loadTrades();
      const today = new Date().toISOString().split("T")[0];
      document.getElementById("tradeDate").value = today;
    });

    document.getElementById("tradeForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const trade = {
        id: Date.now(),
        coinPair: document.getElementById("coinPair").value.trim().toUpperCase(),
        entryPrice: parseFloat(document.getElementById("entryPrice").value),
        exitPrice: parseFloat(document.getElementById("exitPrice").value),
        margin: parseFloat(document.getElementById("margin").value),
        leverage: parseInt(document.getElementById("leverage").value),
        position: document.getElementById("position").value,
        tradeDate: document.getElementById("tradeDate").value
      };
      addTrade(trade);
      this.reset();
      document.getElementById("tradeDate").value = new Date().toISOString().split("T")[0];
    });

    function addTrade(trade) {
      let trades = getTrades();
      trades.unshift(trade);
      saveTrades(trades);
      renderTrades();
    }

    function getTrades() {
      const trades = localStorage.getItem("trades");
      return trades ? JSON.parse(trades) : [];
    }

    function saveTrades(trades) {
      localStorage.setItem("trades", JSON.stringify(trades));
    }

    function loadTrades() {
      renderTrades();
    }

    function renderTrades() {
      const trades = getTrades();
      const tbody = document.getElementById("tradesTableBody");
      const emptyState = document.getElementById("emptyState");
      tbody.innerHTML = "";
      if (trades.length === 0) { 
        emptyState.style.display = "block"; 
        return; 
      }
      emptyState.style.display = "none";

      trades.forEach(trade => {
        const row = document.createElement("tr");

        // position size
        const positionSize = trade.margin * trade.leverage;

        // PNL calculation based on position
        let pnl = 0;
        if (trade.position === "Long") {
          pnl = (trade.exitPrice - trade.entryPrice) * (positionSize / trade.entryPrice);
        } else if (trade.position === "Short") {
          pnl = (trade.entryPrice - trade.exitPrice) * (positionSize / trade.entryPrice);
        }

        const pnlClass = pnl >= 0 ? "text-green-600 font-semibold" : "text-red-600 font-semibold";
        const pnlSymbol = pnl >= 0 ? "+" : "";

        row.innerHTML = `
          <td class="px-4 py-3">${trade.coinPair}</td>
          <td class="px-4 py-3">$${trade.entryPrice}</td>
          <td class="px-4 py-3">$${trade.exitPrice}</td>
          <td class="px-4 py-3">$${trade.margin}</td>
          <td class="px-4 py-3">${trade.leverage}x</td>
          <td class="px-4 py-3">${trade.position}</td>
          <td class="px-4 py-3 ${pnlClass}">${pnlSymbol}${pnl.toFixed(2)} USDT</td>
          <td class="px-4 py-3">${new Date(trade.tradeDate).toLocaleDateString()}</td>
          <td class="px-4 py-3">
            <button onclick="deleteTrade(${trade.id})" class="text-red-600">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function deleteTrade(id) {
      let trades = getTrades();
      trades = trades.filter(t => t.id !== id);
      saveTrades(trades);
      renderTrades();
    }
  </script>
</body>
</html>
